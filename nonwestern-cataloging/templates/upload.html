<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Non-Western Cataloging Project</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>  
        <style>
            .message-box { padding: 12px; }
            .content { margin-top: 20px }
            small { font-size:smaller }
        </style>
        
    </head>
    <body>        
        <div class="container">
            <div class="row">
                <div class="col-md-12 content">
                    <h1>Upload new File</h1>
				    <form method="post" enctype="multipart/form-data">
				    	<input type="radio" name="type" value="printout" checked="checked">
						<label for="printout">MARC Printout OCR</label>
						<br>
						<input type="radio" name="type" value="page">
						<label for="page">Page Image Extraction</label>
						<br>
				    	<input type="file" name="file" multiple="multiple">
				    	<input type="submit" value="Upload">
				    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
